<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facecome — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo logo-small">
      <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="fcg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a45"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
        <path d="M32 4C15.4 4 2 16.1 2 31c0 8.5 4.5 16.1 11.5 21V62l10.4-6.2c2.6.6 5.3 1 8.1 1 16.6 0 30-12.1 30-27S48.6 4 32 4z" fill="url(#fcg)"/>
        <path d="M13 34h38c.6-1.9 1-4 1-6 0-10.5-9-19-20-19s-20 8.5-20 19c0 2 .4 4.1 1 6z" fill="#ffd166"/>
        <circle cx="32" cy="27" r="8" fill="#fff"/>
        <path d="M24 34h16v-2a8 8 0 0 0-16 0v2z" fill="#fff" opacity=".7"/>
      </svg>
      <span class="logo-text">facecome</span>
    </div>
    <button id="logout" class="btn btn-secondary">Log out</button>
  </header>

  <main class="dashboard">
    <div class="card">
      <h1 id="welcome">Welcome!</h1>
      <p id="user-email" class="subtitle"></p>
      <p>You are logged in to Facecome. 🎉</p>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    var session = FacecomeAuth.getSession();
    if (!session) {
      window.location.href = 'login.html';
    } else {
      var user = FacecomeAuth.findUser(session);
      if (user) {
        document.getElementById('welcome').textContent = 'Welcome, ' + user.name + '!';
        document.getElementById('user-email').textContent = user.email;
      }
    }

    document.getElementById('logout').addEventListener('click', function () {
      FacecomeAuth.logout();
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
