<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facecome — Profile</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo logo-small">
      <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="fcg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a45"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
        <path d="M32 4C15.4 4 2 16.1 2 31c0 8.5 4.5 16.1 11.5 21V62l10.4-6.2c2.6.6 5.3 1 8.1 1 16.6 0 30-12.1 30-27S48.6 4 32 4z" fill="url(#fcg)"/>
        <path d="M13 34h38c.6-1.9 1-4 1-6 0-10.5-9-19-20-19s-20 8.5-20 19c0 2 .4 4.1 1 6z" fill="#ffd166"/>
        <circle cx="32" cy="27" r="8" fill="#fff"/>
        <path d="M24 34h16v-2a8 8 0 0 0-16 0v2z" fill="#fff" opacity=".7"/>
      </svg>
      <span class="logo-text">facecome</span>
    </div>
    <nav class="topnav">
      <a href="dashboard.html" class="topnav-link">Feed</a>
      <a href="timeline.html" class="topnav-link">Timeline</a>
      <a href="profile.html" class="topnav-link active">Profile</a>
      <button id="logout" class="btn btn-secondary btn-compact">Log out</button>
    </nav>
  </header>

  <main class="profile-page">
    <div class="profile-col">

      <section class="card profile-card">
        <div class="profile-avatar-row">
          <div id="avatar-view"></div>
          <div class="profile-avatar-actions">
            <input type="file" id="avatar-input" accept="image/*" hidden />
            <button type="button" class="chip" id="avatar-btn">📷 Change photo</button>
          </div>
        </div>

        <label for="name-input">Display name</label>
        <input type="text" id="name-input" maxlength="60" placeholder="Your name" />

        <label for="email-line">Email</label>
        <input type="email" id="email-line" disabled />

        <label for="bio-input">Bio</label>
        <textarea id="bio-input" rows="3" maxlength="300" placeholder="Tell Facecome about yourself…"></textarea>

        <button class="btn btn-primary" id="save-btn">Save profile</button>
        <p id="save-msg" class="error hidden"></p>

        <div class="stats" id="stats"></div>
      </section>

      <section class="recent-section">
        <div class="page-heading">
          <h2>Recent thoughts</h2>
          <a href="timeline.html" class="text-link">See full timeline →</a>
        </div>
        <div id="recent"></div>
        <button class="btn btn-secondary hidden" id="clear-demo-btn">Remove my demo posts</button>
      </section>

    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
